# Hermes schedule manifest. See README.md in this directory for rules.
# Times are America/Vancouver.
# Every schedule inherits the unattended contract in skills/references/scheduled-run.md.

# Runner behavior (hermes/schedules/runner.py, deployed to /opt/hermes-schedules).
runner:
  poll_seconds: 60
  retention_days_pass: 3    # archive PASS workspaces after N days
  retention_days_fail: 14   # FAIL/BLOCKED workspaces retained longer for triage
  archive_on_complete: [PASS]   # archive the workspace the moment a run ends with one of these statuses

# Slack channel IDs (resolved at authoring time; runtime uses IDs, not names).
slack_channels:
  "#autodev-nightly": C0BMZQWBDPA
  "#autodev-health": C0BM25N3DPX
  "#autodev-incidents": C0BM7CUHGAV

# Exact Slack comments are treated as production authorization only after all
# deterministic checks in runner.py pass. IDs are immutable Slack member IDs.
production_approval:
  enabled: true
  # Mention anchor only; the generic Hermes gateway must not serve this channel.
  hermes_slack_user_id: U0BKDG6QP17
  authorized_slack_users: [U09T4LELYES]
  expires_days: 14
  max_runtime_minutes: 480
  max_start_attempts: 10

schedules:
  - name: nightly-verify-promote
    cron: "0 2 * * *"
    prompt: nightly-verify-promote.md
    workspace:
      repo: ts-prefect
      repo_url: https://github.com/TS-Value-Software/ts-prefect
      branch: staging
      agent: codex
      model: gpt-5.6-sol
    slack_channel: "#autodev-nightly"
    max_runtime_minutes: 180
    enabled: true
    # VERIFY-ONLY (E0029 locked decision): merging to main is a de-facto prod
    # deploy for ts-prefect (git_clone at runtime), so scheduled runs never merge.

  - name: nightly-dream
    cron: "30 3 * * *"
    prompt: nightly-dream.md
    workspace:
      repo: ts-prefect
      repo_url: https://github.com/TS-Value-Software/ts-prefect
      branch: staging
      agent: codex
      model: gpt-5.6-sol
    slack_channel: "#autodev-nightly"
    max_runtime_minutes: 150
    enabled: true

  - name: health-6h
    cron: "0 */6 * * *"
    prompt: health-6h.md
    workspace:
      repo: ts-prefect
      repo_url: https://github.com/TS-Value-Software/ts-prefect
      branch: staging
      agent: codex
      model: gpt-5.6-sol
    slack_channel: "#autodev-health"
    max_runtime_minutes: 90
    # After triage, runner.py launches all issue workspaces in parallel and supervises them
    # through `/ticket-flow <ID>` staging verification under this shared wall-clock cap.
    remediation_max_runtime_minutes: 420
    enabled: true
