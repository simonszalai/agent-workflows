# Hermes schedule manifest. See README.md in this directory for rules.
# Times are America/Vancouver.

schedules:
  - name: nightly-verify-promote
    cron: "0 2 * * *"
    prompt: nightly-verify-promote.md
    workspace:
      repo: ts-prefect
      branch: staging
    slack_channel: "#autodev-nightly"
    enabled: false
    # VERIFY-ONLY (E0029 locked decision): merging to main is a de-facto prod
    # deploy for ts-prefect (git_clone at runtime), so scheduled runs never merge.
    blocked_on:
      - "E0029 F0002: ticket-verify --scheduled (verify-only, §9b suppressed)"

  - name: nightly-dream
    cron: "30 3 * * *"
    prompt: nightly-dream.md
    workspace:
      repo: ts-prefect
      branch: staging
    slack_channel: "#autodev-nightly"
    enabled: false
    blocked_on:
      - "night-dream skill (cloud evidence only; epic ticket)"
      - "ts-graph-dream propose-to-Slack path (epic ticket)"

  - name: health-6h
    cron: "0 */6 * * *"
    prompt: health-6h.md
    workspace:
      repo: ts-prefect
      branch: staging
    slack_channel: "#autodev-health"
    enabled: false
    blocked_on:
      - "health-scrapers folded into health-system (epic ticket)"
      - "investigate-flow-fails ticket-dedup/extend + workspace spawn (epic ticket)"
